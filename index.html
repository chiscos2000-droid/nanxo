<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Horas Extra</title>
<style>
  :root{
    --bg:#12161B;
    --surface:#1B2128;
    --surface-2:#232B33;
    --ink:#E9E5DA;
    --ink-dim:#9BA3AC;
    --line:#2E363E;
    --amber:#F2A93B;
    --amber-dark:#412402;
    --teal:#3E9C8D;
    --red:#D9695A;
    --mono: 'Courier New', ui-monospace, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{padding:32px 16px 60px;}
  .wrap{max-width:760px;margin:0 auto;}

  .masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--amber);padding-bottom:14px;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .masthead h1{font-size:22px;font-weight:700;letter-spacing:0.3px;margin:0 0 4px;}
  .masthead p{margin:0;color:var(--ink-dim);font-size:13px;font-family:var(--mono);}
  .stamp{background:var(--amber);color:var(--amber-dark);border-radius:6px;padding:10px 18px;text-align:center;min-width:120px;}
  .stamp .n{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;}
  .stamp .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-top:2px;}

  .mesbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .mesbar label{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;}
  .mesbar select{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:13px;font-family:var(--mono);}
  .mesbar select:focus{outline:none;border-color:var(--amber);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:24px;}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);margin:0 0 16px;font-weight:700;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  label{font-size:12px;color:var(--ink-dim);}
  input{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:10px 12px;font-size:14px;font-family:var(--sans);}
  input:focus{outline:none;border-color:var(--amber);}
  input[type="date"]{font-family:var(--mono);}
  input[type="number"]{font-family:var(--mono);}
  #dia{background:var(--surface);color:var(--ink-dim);}

  .err{color:var(--red);font-size:12px;min-height:16px;margin-top:6px;}

  .btnrow{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;}
  button{background:var(--amber);color:var(--amber-dark);border:none;border-radius:6px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;}
  button:hover{filter:brightness(1.08);}
  button:active{transform:scale(0.98);}
  button.reset{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;color:var(--ink-dim);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:0.5px;border-bottom:1px solid var(--line);padding:0 8px 10px;}
  tbody td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .fecha{font-family:var(--mono);color:var(--ink-dim);white-space:nowrap;}
  .horas{font-family:var(--mono);color:var(--teal);font-weight:700;text-align:right;white-space:nowrap;}
  .del{background:transparent;border:none;color:var(--ink-dim);cursor:pointer;font-size:16px;padding:4px 8px;}
  .del:hover{color:var(--red);}
  .empty{color:var(--ink-dim);font-size:13px;text-align:center;padding:30px 0;}

  @media (max-width:520px){
    .grid{grid-template-columns:1fr;}
    table, thead, tbody, tr, td{display:block;}
    thead{display:none;}
    tbody tr{border-bottom:1px solid var(--line);padding:10px 0;}
    tbody td{border-bottom:none;padding:2px 0;}
    .horas{text-align:left;}
    .del{float:right;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Registro de Horas Extra</h1>
      <p id="rango">Sin registros aún</p>
    </div>
    <div class="stamp">
      <div class="n" id="totalHoras">0</div>
      <div class="l" id="stampLabel">Horas HE</div>
    </div>
  </div>

  <div class="mesbar">
    <label for="mesSelect">Mes</label>
    <select id="mesSelect"></select>
  </div>

  <div class="card">
    <h2>Nuevo registro</h2>
    <div class="grid">
      <div class="field">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="field">
        <label for="dia">Día</label>
        <input type="text" id="dia" readonly placeholder="Se completa solo">
      </div>
      <div class="field">
        <label for="supervisor">Nombre del supervisor</label>
        <input type="text" id="supervisor" placeholder="Ej: Juan Pérez">
      </div>
      <div class="field">
        <label for="horas">Horas extra</label>
        <input type="number" id="horas" min="0" step="0.5" placeholder="Ej: 2.5">
      </div>
      <div class="field full">
        <label for="trabajo">Trabajo realizado</label>
        <input type="text" id="trabajo" placeholder="Ej: Reparación de línea 2">
      </div>
    </div>
    <div class="err" id="error"></div>
    <div class="btnrow">
      <button class="reset" id="btnReset">Borrar este mes</button>
      <button id="btnAdd">Agregar registro</button>
    </div>
  </div>

  <div class="card">
    <h2>Historial</h2>
    <div id="tableWrap">
      <div class="empty">Cargando registros...</div>
    </div>
  </div>

</div>

<script>
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const STORAGE_KEY = 'horas-extra:registros';

const fechaEl = document.getElementById('fecha');
const diaEl = document.getElementById('dia');
const supervisorEl = document.getElementById('supervisor');
const trabajoEl = document.getElementById('trabajo');
const horasEl = document.getElementById('horas');
const errorEl = document.getElementById('error');
const tableWrap = document.getElementById('tableWrap');
const totalHorasEl = document.getElementById('totalHoras');
const rangoEl = document.getElementById('rango');
const stampLabelEl = document.getElementById('stampLabel');
const mesSelect = document.getElementById('mesSelect');

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let registros = [];
let mesActual = todayISO().slice(0,7); // YYYY-MM, mes que se está viendo

function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}

function diaSemana(isoDate){
  if(!isoDate) return '';
  const [y,m,d] = isoDate.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return DIAS[dt.getDay()];
}

function fechaLegible(isoDate){
  const [y,m,d] = isoDate.split('-');
  return `${d}/${m}/${y}`;
}

fechaEl.value = todayISO();
diaEl.value = diaSemana(fechaEl.value);
fechaEl.addEventListener('change', () => { diaEl.value = diaSemana(fechaEl.value); });

async function loadRegistros(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    registros = raw ? JSON.parse(raw) : [];
  }catch(e){
    registros = [];
  }
  render();
}

async function saveRegistros(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
  }catch(e){
    errorEl.textContent = 'No se pudo guardar el registro. Intenta de nuevo.';
  }
}

function nombreMes(ym){
  const [y,m] = ym.split('-').map(Number);
  return `${MESES[m-1]} ${y}`;
}

function populateMesSelect(){
  const metes = new Set(registros.map(r => r.fecha.slice(0,7)));
  metes.add(mesActual);
  const ordenados = [...metes].sort().reverse();

  mesSelect.innerHTML = ordenados.map(ym =>
    `<option value="${ym}" ${ym === mesActual ? 'selected' : ''}>${capitalize(nombreMes(ym))}</option>`
  ).join('');
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function render(){
  populateMesSelect();

  const delMes = registros.filter(r => r.fecha.slice(0,7) === mesActual);
  const ordenados = [...delMes].sort((a,b) => b.fecha.localeCompare(a.fecha));

  if(ordenados.length === 0){
    tableWrap.innerHTML = '<div class="empty">No hay registros para este mes todavía.</div>';
  } else {
    let rows = ordenados.map(r => `
      <tr>
        <td class="fecha">${fechaLegible(r.fecha)}<br>${r.dia}</td>
        <td>${escapeHtml(r.supervisor)}</td>
        <td>${escapeHtml(r.trabajo)}</td>
        <td class="horas">${r.horas} h</td>
        <td><button class="del" data-id="${r.id}" title="Eliminar" aria-label="Eliminar registro">✕</button></td>
      </tr>
    `).join('');

    tableWrap.innerHTML = `
      <table>
        <thead>
          <tr><th>Fecha</th><th>Supervisor</th><th>Trabajo</th><th>Horas</th><th></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    tableWrap.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => eliminarRegistro(btn.dataset.id));
    });
  }

  const totalHoras = delMes.reduce((sum, r) => sum + Number(r.horas), 0);
  totalHorasEl.textContent = Number.isInteger(totalHoras) ? totalHoras : totalHoras.toFixed(1);
  stampLabelEl.textContent = `Horas HE`;

  if(delMes.length > 0){
    rangoEl.textContent = `${capitalize(nombreMes(mesActual))} · ${delMes.length} registro${delMes.length !== 1 ? 's' : ''}`;
  } else {
    rangoEl.textContent = `${capitalize(nombreMes(mesActual))} · sin registros`;
  }
}

mesSelect.addEventListener('change', () => {
  mesActual = mesSelect.value;
  render();
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function agregarRegistro(){
  errorEl.textContent = '';

  const fecha = fechaEl.value;
  const dia = diaEl.value;
  const supervisor = supervisorEl.value.trim();
  const trabajo = trabajoEl.value.trim();
  const horas = horasEl.value;

  if(!fecha){ errorEl.textContent = 'Selecciona una fecha.'; return; }
  if(!supervisor){ errorEl.textContent = 'Ingresa el nombre del supervisor.'; return; }
  if(!trabajo){ errorEl.textContent = 'Describe el trabajo realizado.'; return; }
  if(!horas || Number(horas) <= 0){ errorEl.textContent = 'Ingresa una cantidad de horas válida.'; return; }

  const nuevo = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    fecha, dia, supervisor, trabajo,
    horas: Number(horas)
  };

  registros.push(nuevo);
  await saveRegistros();
  render();

  supervisorEl.value = '';
  trabajoEl.value = '';
  horasEl.value = '';
  supervisorEl.focus();
}

async function eliminarRegistro(id){
  registros = registros.filter(r => r.id !== id);
  await saveRegistros();
  render();
}

async function borrarTodo(){
  const delMes = registros.filter(r => r.fecha.slice(0,7) === mesActual);
  if(delMes.length === 0) return;
  if(!confirm(`¿Borrar los ${delMes.length} registros de ${capitalize(nombreMes(mesActual))}? Esta acción no se puede deshacer.`)) return;
  registros = registros.filter(r => r.fecha.slice(0,7) !== mesActual);
  await saveRegistros();
  render();
}

document.getElementById('btnAdd').addEventListener('click', agregarRegistro);
document.getElementById('btnReset').addEventListener('click', borrarTodo);

loadRegistros();
</script>
</body>
</html>
